<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1565C0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/critical.css" />
  <link rel="stylesheet" href="/mobile-ui.css?v=2.1" />
  <title>GeoSafe — Report Incident</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="app-shell">
  <div class="app-container">
    <header class="resident-topbar">
      <div class="resident-brand">
        <span class="resident-brand__mark">⌖</span>
        <span>GeoSafe</span>
      </div>
      <button type="button" class="ui-btn-ghost" onclick="logout()">Logout</button>
    </header>

    <div style="margin-bottom:14px;">
      <h1 style="font-size:22px; font-weight:800; margin:0;" id="page-title">Report Disaster Incident</h1>
      <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Barangay Bayanan Emergency Assistance</p>
    </div>

    <section class="ui-card">
      <form id="report-form">
        <label style="font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:6px;">Incident Type</label>
        <select name="incident_type" id="incident_type_select" required class="ui-select">
          <option value="">Select type…</option>
          <option value="Flood">💧 Flood</option>
          <option value="Earthquake">⚡ Earthquake</option>
          <option value="Fire">🔥 Fire</option>
          <option value="Landslide">⛰️ Landslide</option>
          <option value="Storm">🌀 Storm / Typhoon</option>
          <option value="Medical">🚑 Medical Emergency</option>
          <option value="SOS">🚨 SOS Rescue</option>
          <option value="Other">⚠️ Other</option>
        </select>

        <label style="font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:6px;">Description & Situation</label>
        <textarea name="description" required minlength="6" rows="4" class="ui-textarea" placeholder="Describe the incident (e.g. water height, stranded family members, nearest landmark)…"></textarea>

        <div style="background:var(--bg-app); border:1.5px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong style="font-size:13px; color:var(--text);">Current Location GPS</strong>
              <p id="location-status" style="font-size:11px; color:var(--text-muted); margin:2px 0 0;">Location not acquired</p>
            </div>
            <button type="button" id="get-location" class="ui-btn ui-btn-secondary" style="width:auto; padding:8px 14px; font-size:12px;">
              📍 Capture GPS
            </button>
          </div>
        </div>

        <details style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">
          <summary style="cursor:pointer; font-weight:600;">Manual Coordinates Override</summary>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
            <input type="number" id="manual-lat" step="any" placeholder="Latitude" class="ui-input" style="margin:0;" />
            <input type="number" id="manual-lng" step="any" placeholder="Longitude" class="ui-input" style="margin:0;" />
          </div>
          <button type="button" id="use-manual" class="ui-btn ui-btn-secondary" style="margin-top:8px; font-size:12px;">Apply coordinates</button>
        </details>

        <input type="hidden" name="latitude" id="latitude" />
        <input type="hidden" name="longitude" id="longitude" />
        <div id="map-preview" class="map-card" style="min-height:160px; margin-bottom:12px; display:none;"></div>
        <p id="report-error" class="text-error hidden" style="color:var(--emergency); font-size:12px; margin-bottom:8px;"></p>
        <button type="submit" class="ui-btn ui-btn-primary" id="submit-btn">Submit Incident Report</button>
      </form>
    </section>

    <section class="ui-card">
      <h2>My Incident Reports</h2>
      <div id="reports-list"><p class="text-muted">Loading reports…</p></div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script>
    const user = requireAuth(['resident']);
    if (!user) throw new Error('unauthorized');
    injectBottomNav('report');

    const isSos = new URLSearchParams(location.search).get('sos') === '1';
    if (isSos) {
      document.getElementById('page-title').textContent = 'Emergency SOS Rescue';
      document.getElementById('incident_type_select').value = 'SOS';
      document.querySelector('[name=description]').value =
        'EMERGENCY SOS: Immediate rescue assistance requested at my current GPS location.';
      const sBtn = document.getElementById('submit-btn');
      sBtn.textContent = '🚨 Dispatch SOS Rescue Immediately';
      sBtn.style.background = 'var(--emergency)';
    }

    const statusEl = document.getElementById('location-status');

    async function fetchGPS() {
      statusEl.textContent = 'Acquiring GPS…';
      try {
        const { latitude, longitude } = await getGeolocation();
        setLocationOnForm(latitude, longitude, statusEl, 'map-preview');
        document.getElementById('map-preview').style.display = 'block';
      } catch (err) {
        statusEl.textContent = 'GPS simulated: 14.3972, 121.0200 (Bayanan)';
        setLocationOnForm(14.3972, 121.0200, statusEl, 'map-preview');
      }
    }

    document.getElementById('get-location').addEventListener('click', fetchGPS);

    document.getElementById('use-manual').addEventListener('click', () => {
      const lat = parseFloat(document.getElementById('manual-lat').value);
      const lng = parseFloat(document.getElementById('manual-lng').value);
      if (Number.isNaN(lat) || Number.isNaN(lng)) {
        statusEl.textContent = 'Enter valid coordinates';
        return;
      }
      setLocationOnForm(lat, lng, statusEl, 'map-preview');
      document.getElementById('map-preview').style.display = 'block';
    });

    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('report-error');
      errEl.classList.add('hidden');
      const fd = new FormData(e.target);
      let lat = parseFloat(fd.get('latitude')) || 14.3972;
      let lng = parseFloat(fd.get('longitude')) || 121.0200;

      const submitBtn = document.getElementById('submit-btn');
      const origText = submitBtn.textContent;
      submitBtn.textContent = 'Submitting…';
      submitBtn.disabled = true;

      try {
        await api('/api/reports', {
          method: 'POST',
          body: JSON.stringify({
            incident_type: fd.get('incident_type'),
            description: fd.get('description'),
            latitude: lat,
            longitude: lng,
          }),
        });
        showToast(isSos ? '🚨 SOS Request Sent to BDRRMC!' : '✓ Incident Report Submitted', 'success');
        e.target.reset();
        if (isSos) {
          document.getElementById('incident_type_select').value = 'SOS';
        }
        statusEl.textContent = 'Location not captured';
        document.getElementById('map-preview').style.display = 'none';
        loadReports();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        submitBtn.textContent = origText;
        submitBtn.disabled = false;
      }
    });

    function renderReport(r) {
      return `<div class="report-item">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
          <strong style="font-size:13px; color:var(--text);">${escapeHtml(r.incident_type)}</strong>
          <span>${r.severity ? severityBadge(r.severity) : ''} ${statusBadge(r.status)}</span>
        </div>
        <p style="margin:0 0 4px; font-size:12px; color:var(--text-muted);">${escapeHtml(r.description)}</p>
        <p class="text-muted" style="margin:0; font-size:11px;">📍 ${Number(r.latitude).toFixed(4)}, ${Number(r.longitude).toFixed(4)} · ${formatDate(r.created_at)}</p>
      </div>`;
    }

    async function loadReports() {
      const el = document.getElementById('reports-list');
      try {
        const { reports } = await api('/api/reports');
        el.innerHTML = reports && reports.length ? reports.map(renderReport).join('') : '<p class="text-muted">No reports filed yet.</p>';
      } catch (err) {
        el.innerHTML = `<p class="text-muted">No reports yet.</p>`;
      }
    }

    initSocket({
      'status-update': (r) => {
        if (r.user_id === user.id) loadReports();
      },
      'alert-broadcast': (a) => showToast(a.message, 'danger'),
    });

    loadReports();
    if (isSos) fetchGPS();
  </script>
</body>
</html>
