<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#12151f" />
  <link rel="manifest" href="/manifest.json" /><link rel="stylesheet" href="/critical.css" /><link rel="stylesheet" href="/mobile-ui.css" /><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <title>GeoSafe — Responder Dashboard</title><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head><body class="app-shell staff-shell"><div class="app-container staff-container">
  <header class="page-header staff-header"><div><div class="brand">GeoSafe System · Responder</div><h1>Assigned incidents</h1></div><div class="staff-user"><span id="user-name"></span><button type="button" class="ui-btn-ghost" onclick="logout()">Logout</button></div></header>
  <main><p class="text-muted responder-intro">Use the status controls to keep the incident command team informed in real time.</p><div id="incidents-list" class="incident-list"><p class="text-muted">Loading incidents…</p></div></main>
</div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script><script>
const user = requireAuth(['responder']); if (!user) throw new Error('unauthorized'); document.getElementById('user-name').textContent = user.name;
async function updateStatus(id, status) { await api(`/api/reports/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) }); showToast(`Status updated to ${status.replace('_', ' ')}`, 'success'); loadIncidents(); }
function renderIncident(r) { const mapId = `map-${r.id}`; const actions = []; if (['verified', 'responding'].includes(r.status)) actions.push(`<button onclick="updateStatus(${r.id}, 'responding')" class="table-btn table-btn--dispatch">Responding</button>`); if (['responding', 'verified'].includes(r.status)) actions.push(`<button onclick="updateStatus(${r.id}, 'on_site')" class="table-btn table-btn--onsite">On site</button>`); if (r.status !== 'resolved') actions.push(`<button onclick="updateStatus(${r.id}, 'resolved')" class="table-btn table-btn--resolved">Mark resolved</button>`); return `<article class="incident-card"><div class="incident-card__header"><div><h2>#${r.id} ${escapeHtml(r.incident_type)}</h2><p class="text-muted">Reporter: ${escapeHtml(r.reporter_name || 'Unknown')}</p></div><div class="incident-badges">${r.severity ? severityBadge(r.severity) : ''} ${statusBadge(r.status)}</div></div><p class="incident-description">${escapeHtml(r.description)}</p><p class="incident-location">📍 ${r.latitude}, ${r.longitude}</p><div id="${mapId}" class="incident-map" aria-label="Incident location map"></div><div class="incident-actions">${actions.join('')}</div></article>`; }
async function loadIncidents() { const el = document.getElementById('incidents-list'); try { const { reports } = await api('/api/reports'); if (!reports.length) { el.innerHTML = '<div class="empty-state"><span>✓</span><h2>No assigned incidents</h2><p>An admin will assign you to a report when assistance is needed.</p></div>'; return; } el.innerHTML = reports.map(renderIncident).join(''); reports.forEach((r) => { const mapId = `map-${r.id}`; const mapEl = document.getElementById(mapId); if (mapEl) { const map = L.map(mapId).setView([parseFloat(r.latitude), parseFloat(r.longitude)], 14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map); L.marker([parseFloat(r.latitude), parseFloat(r.longitude)]).addTo(map); } }); } catch (err) { el.innerHTML = `<p class="text-error">${escapeHtml(err.message)}</p>`; } }
window.updateStatus = updateStatus; initSocket({ 'alert-broadcast': (alert) => { showAlertBanner(alert); showToast(`Emergency Alert: ${alert.message}`, 'danger'); }, 'status-update': () => loadIncidents(), 'new-report': () => loadIncidents() }); loadIncidents();
</script></body></html>
