<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1565C0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/critical.css" />
  <link rel="stylesheet" href="/mobile-ui.css?v=3.0" />
  <title>GeoSafe — Evacuation Navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Google Maps Navigation Mode Styling */
    :root {
      --gmap-green: #1B873F;
      --gmap-dark: #202124;
      --gmap-blue: #1A73E8;
    }

    body.nav-active-mode {
      overflow: hidden;
      padding-bottom: 0 !important;
    }

    body.nav-active-mode .bottom-nav,
    body.nav-active-mode .resident-topbar,
    body.nav-active-mode .page-intro-header {
      display: none !important;
    }

    .nav-viewport {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Standard Preview Mode Layout */
    .map-frame-box {
      width: 100%;
      height: 320px;
      min-height: 320px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--border);
      position: relative;
      background: #E5E7EB;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    #route-map {
      width: 100%;
      height: 100%;
      min-height: 320px;
      z-index: 1;
    }

    /* Fullscreen Mode when Navigation is ACTIVE */
    .nav-active-mode .map-frame-box {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100dvh;
      border-radius: 0;
      border: none;
      margin: 0;
      z-index: 9999;
    }

    .nav-active-mode #route-map {
      height: 100dvh;
    }

    /* Top Google Maps Turn Guidance Banner */
    .gmap-top-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10000;
      background: var(--gmap-green);
      color: white;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      gap: 14px;
      animation: slideDown 0.3s ease;
    }

    .nav-active-mode .gmap-top-hud {
      display: flex;
    }

    .gmap-turn-icon {
      width: 46px;
      height: 46px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .gmap-turn-dist {
      font-size: 13px;
      font-weight: 700;
      color: #A7F3D0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .gmap-turn-instruction {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.25;
      margin: 0;
    }

    /* Floating Map Controls (Recenter & Voice Toggle) */
    .gmap-floating-controls {
      position: absolute;
      right: 16px;
      bottom: 110px;
      z-index: 10000;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .nav-active-mode .gmap-floating-controls {
      display: flex;
    }

    .gmap-float-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gmap-float-btn:active {
      transform: scale(0.92);
    }

    /* Bottom Google Maps Navigation Dock */
    .gmap-bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      background: white;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.25);
      display: none;
      justify-content: space-between;
      align-items: center;
    }

    .nav-active-mode .gmap-bottom-dock {
      display: flex;
    }

    .gmap-eta-time {
      font-size: 26px;
      font-weight: 900;
      color: var(--gmap-green);
      line-height: 1;
    }

    .gmap-eta-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gmap-exit-btn {
      background: #FEE2E2;
      color: #DC2626;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.2);
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="app-shell">

  <!-- HUD: Top Turn Instruction (Shown in Navigation Mode) -->
  <div class="gmap-top-hud" id="gmap-top-hud">
    <div class="gmap-turn-icon" id="hud-turn-icon">⬆</div>
    <div style="flex:1;">
      <div class="gmap-turn-dist" id="hud-turn-dist">In 120 meters</div>
      <p class="gmap-turn-instruction" id="hud-turn-instruction">Head northeast on designated route</p>
    </div>
  </div>

  <!-- HUD: Floating Map Controls -->
  <div class="gmap-floating-controls">
    <button type="button" class="gmap-float-btn" id="btn-voice-toggle" onclick="toggleVoiceSpeech()" title="Toggle Voice Guidance">
      <span id="voice-icon">🔊</span>
    </button>
    <button type="button" class="gmap-float-btn" onclick="recenterGPS()" title="Recenter GPS">
      🎯
    </button>
  </div>

  <!-- HUD: Bottom ETA Dock -->
  <div class="gmap-bottom-dock" id="gmap-bottom-dock">
    <div>
      <div class="gmap-eta-time" id="hud-eta-min">8 min</div>
      <div class="gmap-eta-sub">
        <span id="hud-eta-dist">650 m</span> · <span id="hud-eta-clock">11:55 AM</span> arrival
      </div>
    </div>
    <button type="button" class="gmap-exit-btn" onclick="stopNavigation()" title="Exit Navigation">
      ✕
    </button>
  </div>

  <!-- Standard Screen Container (Hidden during Navigation Mode) -->
  <div class="app-container">
    <header class="resident-topbar">
      <div class="resident-brand">
        <span class="resident-brand__mark">⌖</span>
        <span>GeoSafe</span>
      </div>
      <button type="button" class="ui-btn-ghost" onclick="logout()">Logout</button>
    </header>

    <div class="page-intro-header" style="margin-bottom:12px;">
      <h1 style="font-size:22px; font-weight:800; margin:0;">Safe Evacuation Routes</h1>
      <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Turn-by-turn walking guidance to safe havens in Barangay Bayanan.</p>
    </div>

    <!-- Map Box -->
    <section class="map-frame-box" id="map-wrapper">
      <div class="map-card__badge">
        <span class="map-card__badge-dot" style="background:var(--green);"></span>
        <span id="nav-status">Safe Route Ready</span>
      </div>
      <div id="route-map"></div>
    </section>

    <!-- Destination Pickers -->
    <section class="ui-card">
      <h2 style="margin-top:0; font-size:15px;">Select Evacuation Haven</h2>
      <div class="action-grid" style="margin-bottom:12px;">
        <button type="button" class="action-card route-pick" data-route="1" id="btn-haven-1" style="border:2px solid var(--primary); cursor:pointer; width:100%; text-align:left;">
          <span class="action-card__icon" style="background:var(--success-light); color:var(--success);">🛡️</span>
          <span class="action-card__label">Baywalk Covered Court<br><small style="font-size:11px; font-weight:500; color:var(--text-muted);">Lakeshore · 8 min</small></span>
        </button>
        <button type="button" class="action-card route-pick" data-route="2" id="btn-haven-2" style="border:1px solid var(--border); cursor:pointer; width:100%; text-align:left;">
          <span class="action-card__icon" style="background:var(--primary-light); color:var(--primary);">🏫</span>
          <span class="action-card__label">Elementary School Unit 1<br><small style="font-size:11px; font-weight:500; color:var(--text-muted);">National Rd · 12 min</small></span>
        </button>
      </div>

      <!-- Start Turn by Turn Navigation Button -->
      <button type="button" id="start-nav-btn" class="ui-btn ui-btn-primary" style="background:var(--gmap-green); font-size:15px; padding:14px; margin-bottom:8px; box-shadow:0 4px 14px rgba(27, 135, 63, 0.3);">
        🧭 Start Turn-by-Turn Navigation
      </button>
      <button type="button" id="open-maps-btn" class="ui-btn ui-btn-secondary">
        ↗ Open in External Google Maps
      </button>
    </section>

    <!-- Directions Step List -->
    <section class="ui-card">
      <h2 style="margin-top:0; font-size:15px;">Route Guidance Preview</h2>
      <ol id="directions-list" class="directions-list"></ol>
    </section>
  </div>

  <script src="/evacuation-routes.js"></script>
  <script src="/app.js"></script>
  <script>
    const user = requireAuth(['resident']);
    if (!user) throw new Error('unauthorized');
    injectBottomNav('route');

    let routeMap = null;
    let routeLayers = null;
    let userMarkerLayer = null;
    let userPos = { lat: 14.4106, lng: 121.0502 };
    let selectedHaven = EVACUATION_HAVENS[0];
    let watchId = null;
    let isNavigating = false;
    let voiceEnabled = true;
    let currentSteps = [];
    let currentStepIdx = 0;

    // 1. Voice Speech Guidance
    function speakDirection(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoiceSpeech() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-icon').textContent = voiceEnabled ? '🔊' : '🔇';
      showToast(voiceEnabled ? 'Voice guidance ON' : 'Voice guidance MUTED');
    }

    // 2. Initialize Leaflet Map
    function initMap() {
      if (routeMap) return;
      routeMap = L.map('route-map', {
        zoomControl: false,
        attributionControl: false
      }).setView([userPos.lat, userPos.lng], 16);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(routeMap);

      routeLayers = L.layerGroup().addTo(routeMap);

      setTimeout(() => routeMap?.invalidateSize(), 200);
    }

    function calculateETAClock(durationSec) {
      const d = new Date(Date.now() + durationSec * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function drawRoute(havenId) {
      initMap();
      selectedHaven = getHavenById(havenId || selectedHaven.id);

      document.getElementById('btn-haven-1').style.border = selectedHaven.id === 1 ? '2px solid var(--primary)' : '1px solid var(--border)';
      document.getElementById('btn-haven-2').style.border = selectedHaven.id === 2 ? '2px solid var(--primary)' : '1px solid var(--border)';

      if (routeLayers) routeLayers.clearLayers();

      const distM = haversineKm(userPos.lat, userPos.lng, selectedHaven.lat, selectedHaven.lng) * 1000;
      const durationSec = (distM / 80) * 60;

      let routeData = {
        distanceM: distM,
        durationSec: durationSec,
        coordinates: routeWaypoints(userPos.lat, userPos.lng, selectedHaven.lat, selectedHaven.lng),
        steps: [
          { instruction: `Head toward designated safe evacuation route on Bayanan`, distanceM: distM * 0.35, durationSec: durationSec * 0.35, icon: '⬆' },
          { instruction: `Follow safe signs along route to ${selectedHaven.name}`, distanceM: distM * 0.45, durationSec: durationSec * 0.45, icon: '↱' },
          { instruction: `Arrive at ${selectedHaven.name} safe haven`, distanceM: distM * 0.2, durationSec: durationSec * 0.2, icon: '🏁' }
        ]
      };

      try {
        const fetched = await fetchWalkingRoute(userPos.lat, userPos.lng, selectedHaven.lat, selectedHaven.lng);
        if (fetched && fetched.coordinates) routeData = fetched;
      } catch (e) {}

      currentSteps = routeData.steps;

      // Draw custom user marker with pulsing beacon
      userMarkerLayer = L.circleMarker([userPos.lat, userPos.lng], {
        radius: 11,
        color: '#1565C0',
        fillColor: '#2196F3',
        fillOpacity: 1,
        weight: 3
      }).bindPopup('<b>Your Live Position</b>').addTo(routeLayers);

      // Haven marker
      L.marker([selectedHaven.lat, selectedHaven.lng]).bindPopup(`<b>${selectedHaven.name}</b><br>Safe Evacuation Haven`).addTo(routeLayers);

      // Route polyline with high visibility
      L.polyline(routeData.coordinates, {
        color: '#1B873F',
        weight: 7,
        opacity: 0.95
      }).addTo(routeLayers);

      drawAllHavens(routeMap, routeLayers);
      fitMapToPath(routeMap, routeData.coordinates);

      // Update HUD values
      const minStr = Math.round(routeData.durationSec / 60) + ' min';
      const distStr = formatDistance(routeData.distanceM);
      document.getElementById('hud-eta-min').textContent = minStr;
      document.getElementById('hud-eta-dist').textContent = distStr;
      document.getElementById('hud-eta-clock').textContent = calculateETAClock(routeData.durationSec);

      // Render step list preview
      document.getElementById('directions-list').innerHTML = currentSteps.map((s, i) => `
        <li style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);">
          <span style="width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;">${i + 1}</span>
          <div>
            <div style="font-weight:700; color:var(--text);">${escapeHtml(s.instruction)}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${formatDistance(s.distanceM)} · ${formatDuration(s.durationSec)}</div>
          </div>
        </li>
      `).join('');
    }

    // 3. Start Google Maps Fullscreen Navigation Mode
    function startNavigation() {
      isNavigating = true;
      document.body.classList.add('nav-active-mode');

      const firstStep = currentSteps[0] || { instruction: `Walk to ${selectedHaven.name}`, distanceM: 200, icon: '⬆' };
      document.getElementById('hud-turn-icon').textContent = firstStep.icon || '⬆';
      document.getElementById('hud-turn-dist').textContent = `In ${formatDistance(firstStep.distanceM)}`;
      document.getElementById('hud-turn-instruction').textContent = firstStep.instruction;

      speakDirection(`Starting walking navigation to ${selectedHaven.name}. ${firstStep.instruction}`);

      if (routeMap) {
        routeMap.invalidateSize();
        routeMap.setView([userPos.lat, userPos.lng], 18);
      }

      startGPSTracking();
    }

    function stopNavigation() {
      isNavigating = false;
      document.body.classList.remove('nav-active-mode');
      if (watchId != null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (routeMap) {
        routeMap.invalidateSize();
        drawRoute(selectedHaven.id);
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function recenterGPS() {
      if (routeMap && userPos) {
        routeMap.setView([userPos.lat, userPos.lng], 18);
      }
    }

    function startGPSTracking() {
      if (!navigator.geolocation || watchId != null) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (userMarkerLayer) userMarkerLayer.setLatLng([userPos.lat, userPos.lng]);
          if (isNavigating && routeMap) routeMap.panTo([userPos.lat, userPos.lng]);

          const remainM = remainingToDestination(userPos.lat, userPos.lng, selectedHaven);
          document.getElementById('hud-eta-dist').textContent = formatDistance(remainM);
          document.getElementById('hud-eta-min').textContent = Math.round((remainM / 80)) + ' min';

          if (remainM < 25) {
            document.getElementById('hud-turn-instruction').textContent = `Arrived at ${selectedHaven.name}`;
            speakDirection(`You have arrived at ${selectedHaven.name} safe evacuation haven.`);
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 8000 }
      );
    }

    // Bind Buttons
    document.getElementById('start-nav-btn').addEventListener('click', () => {
      startNavigation();
    });

    document.querySelectorAll('.route-pick').forEach(btn => {
      btn.addEventListener('click', () => {
        drawRoute(parseInt(btn.dataset.route, 10));
      });
    });

    document.getElementById('open-maps-btn').addEventListener('click', () => {
      openGoogleMapsDirections(selectedHaven, userPos.lat, userPos.lng);
    });

    // Acquire GPS
    async function setupInitial() {
      initMap();
      drawRoute(1);
      try {
        const pos = await getGeolocation();
        userPos = { lat: pos.latitude, lng: pos.longitude };
        drawRoute(1);
      } catch (e) {}
    }

    setupInitial();

    window.addEventListener('resize', () => {
      if (routeMap) routeMap.invalidateSize();
    });
  </script>
</body>
</html>
