<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12151f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/critical.css" />
  <link rel="stylesheet" href="/mobile-ui.css" />
  <title>GeoSafe — Safe Navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .nav-summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .nav-stat {
      background: #0f1319;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .nav-stat__val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green);
    }
    .nav-stat__lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 4px;
    }
    .nav-stat--remain .nav-stat__val {
      color: var(--orange);
    }
    .directions-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .directions-list li {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .directions-list li:last-child {
      border-bottom: none;
    }
    .step-num {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2d3748;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .step-dist {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--green);
      margin-top: 6px;
    }
    .live-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body class="app-shell">
  <div class="app-container">
    <header class="page-header">
      <div>
        <div class="brand">GEOSAFE SYSTEM</div>
        <h1>Safe Navigation</h1>
      </div>
      <button type="button" class="ui-btn-ghost" onclick="logout()">Logout</button>
    </header>

    <section class="ui-card" style="padding-bottom:10px">
      <div class="nav-summary">
        <div class="nav-stat">
          <div class="nav-stat__val" id="stat-distance">—</div>
          <div class="nav-stat__lbl">Total distance</div>
        </div>
        <div class="nav-stat">
          <div class="nav-stat__val" id="stat-duration">—</div>
          <div class="nav-stat__lbl">Walk time</div>
        </div>
        <div class="nav-stat nav-stat--remain">
          <div class="nav-stat__val" id="stat-remaining">—</div>
          <div class="nav-stat__lbl">Remaining</div>
        </div>
      </div>
      <p id="nav-destination" class="text-muted" style="margin:0;font-size:0.85rem"></p>
      <p id="live-tracking" class="live-badge hidden">Live GPS tracking on</p>
    </section>

    <section class="map-card" style="min-height:260px">
      <div class="map-card__badge">
        <span class="map-card__badge-dot" style="background:var(--green)"></span>
        <span id="nav-status">Calculating route…</span>
      </div>
      <div id="route-map" style="height:260px"></div>
    </section>

    <section class="ui-card">
      <h2 style="margin-top:0">Evacuation Routes (Bayanan)</h2>
      <div class="action-grid" style="margin-bottom:12px">
        <button type="button" class="action-card route-pick" data-route="1" style="border:none;cursor:pointer;width:100%">
          <span class="action-card__icon">1️⃣</span>
          <span class="action-card__label">Baywalk Covered Court</span>
        </button>
        <button type="button" class="action-card route-pick" data-route="2" style="border:none;cursor:pointer;width:100%">
          <span class="action-card__icon">2️⃣</span>
          <span class="action-card__label">Elementary School Unit 1</span>
        </button>
      </div>
      <button type="button" id="start-nav" class="ui-btn ui-btn-primary" style="background:var(--green);margin-bottom:8px">
        ▶ Start Navigation
      </button>
      <button type="button" id="refresh-route" class="ui-btn ui-btn-secondary" style="margin-bottom:8px">🧭 Recalculate Route</button>
      <button type="button" id="open-maps" class="ui-btn ui-btn-secondary">Open in Google Maps</button>
    </section>

    <section class="ui-card">
      <h2 style="margin-top:0">Turn-by-turn directions</h2>
      <ol id="directions-list" class="directions-list">
        <li class="text-muted">Select a route and tap Start Navigation</li>
      </ol>
    </section>
  </div>

  <script src="/evacuation-routes.js"></script>
  <script src="/app.js"></script>
  <script>
    const user = requireAuth(['resident']);
    if (!user) throw new Error('unauthorized');
    injectBottomNav('route');

    let routeMap = null;
    let routeLayers = null;
    let userMarkerLayer = null;
    let userPos = { lat: BAYANAN_CENTER.lat, lng: BAYANAN_CENTER.lng };
    let selectedHaven = EVACUATION_HAVENS[0];
    let currentRoute = null;
    let watchId = null;
    let isNavigating = false;

    function clearRouteLayers() {
      if (routeLayers && routeMap) {
        routeMap.removeLayer(routeLayers);
        routeLayers = null;
        userMarkerLayer = null;
      }
    }

    function renderDirections(steps) {
      const list = document.getElementById('directions-list');
      if (!steps?.length) {
        list.innerHTML = '<li class="text-muted">No directions available</li>';
        return;
      }
      list.innerHTML = steps
        .map(
          (s, i) => `<li>
        <span class="step-num">${i + 1}</span>
        <div>
          <div>${escapeHtml(s.instruction)}</div>
          <div class="step-dist">${formatDistance(s.distanceM)} · ${formatDuration(s.durationSec)}</div>
        </div>
      </li>`
        )
        .join('');
    }

    function updateStats(routeData) {
      document.getElementById('stat-distance').textContent = formatDistance(routeData.distanceM);
      document.getElementById('stat-duration').textContent = formatDuration(routeData.durationSec);
      updateRemaining();
      document.getElementById('nav-destination').textContent = `To: ${selectedHaven.name}`;
    }

    function updateRemaining() {
      const remainM = remainingToDestination(userPos.lat, userPos.lng, selectedHaven);
      document.getElementById('stat-remaining').textContent = formatDistance(remainM);
      if (remainM < 30) {
        document.getElementById('nav-status').textContent = 'You have arrived at the safe haven';
      } else if (isNavigating) {
        document.getElementById('nav-status').textContent = `${formatDistance(remainM)} to destination`;
      }
    }

    function updateUserMarkerPosition(lat, lng) {
      userPos = { lat, lng };
      if (userMarkerLayer) {
        userMarkerLayer.setLatLng([lat, lng]);
      }
      updateRemaining();
    }

    function startLiveTracking() {
      if (!navigator.geolocation || watchId != null) return;
      document.getElementById('live-tracking').classList.remove('hidden');
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          updateUserMarkerPosition(pos.coords.latitude, pos.coords.longitude);
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    function stopLiveTracking() {
      if (watchId != null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      document.getElementById('live-tracking').classList.add('hidden');
      isNavigating = false;
    }

    async function drawRoute(havenId, startNav = false) {
      selectedHaven = getHavenById(havenId || selectedHaven.id);
      document.getElementById('nav-status').textContent = 'Calculating walking route…';

      try {
        const pos = await getGeolocation();
        userPos = { lat: pos.latitude, lng: pos.longitude };
      } catch {
        userPos = { lat: BAYANAN_CENTER.lat, lng: BAYANAN_CENTER.lng };
      }

      let routeData;
      try {
        routeData = await fetchWalkingRoute(
          userPos.lat,
          userPos.lng,
          selectedHaven.lat,
          selectedHaven.lng
        );
        currentRoute = routeData;
      } catch (err) {
        showToast('Using direct path — ' + err.message, 'warning');
        const distM = haversineKm(userPos.lat, userPos.lng, selectedHaven.lat, selectedHaven.lng) * 1000;
        routeData = {
          distanceM: distM,
          durationSec: (distM / 80) * 60,
          coordinates: routeWaypoints(userPos.lat, userPos.lng, selectedHaven.lat, selectedHaven.lng),
          steps: [
            { instruction: `Walk to ${selectedHaven.name}`, distanceM: distM, durationSec: (distM / 80) * 60 },
            { instruction: 'Arrive at destination', distanceM: 0, durationSec: 0 },
          ],
        };
        currentRoute = routeData;
      }

      if (!routeMap) {
        routeMap = L.map('route-map', { zoomControl: true }).setView([userPos.lat, userPos.lng], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(routeMap);
      }

      clearRouteLayers();
      routeLayers = L.layerGroup();
      const drawn = drawNavigationRoute(
        routeMap,
        userPos.lat,
        userPos.lng,
        selectedHaven,
        routeData,
        routeLayers
      );
      userMarkerLayer = drawn.userMarker;
      drawAllHavens(routeMap, routeLayers);
      routeLayers.addTo(routeMap);
      fitMapToPath(routeMap, routeData.coordinates);

      updateStats(routeData);
      renderDirections(routeData.steps);
      document.getElementById('nav-status').textContent = 'Route ready — follow green path';

      document.querySelectorAll('.route-pick').forEach((btn) => {
        btn.style.outline = btn.dataset.route === String(selectedHaven.id) ? '2px solid var(--orange)' : 'none';
      });

      if (startNav) {
        isNavigating = true;
        startLiveTracking();
        document.getElementById('start-nav').textContent = '■ Stop Navigation';
      }

      setTimeout(() => routeMap.invalidateSize(), 150);
    }

    document.querySelectorAll('.route-pick').forEach((btn) => {
      btn.addEventListener('click', () => {
        stopLiveTracking();
        document.getElementById('start-nav').textContent = '▶ Start Navigation';
        drawRoute(parseInt(btn.dataset.route, 10));
      });
    });

    document.getElementById('start-nav').addEventListener('click', () => {
      if (isNavigating) {
        stopLiveTracking();
        document.getElementById('start-nav').textContent = '▶ Start Navigation';
        document.getElementById('nav-status').textContent = 'Navigation stopped';
      } else {
        drawRoute(selectedHaven.id, true);
      }
    });

    document.getElementById('refresh-route').addEventListener('click', () => {
      const { haven } = getNearestHaven(userPos.lat, userPos.lng);
      drawRoute(haven.id, isNavigating);
    });

    document.getElementById('open-maps').addEventListener('click', () => {
      openGoogleMapsDirections(selectedHaven, userPos.lat, userPos.lng);
    });

    drawRoute(1);
    window.addEventListener('resize', () => routeMap?.invalidateSize());
    window.addEventListener('beforeunload', stopLiveTracking);
  </script>
</body>
</html>
