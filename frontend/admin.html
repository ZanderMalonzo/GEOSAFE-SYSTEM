<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#12151f" />
  <link rel="manifest" href="/manifest.json" /><link rel="stylesheet" href="/critical.css" /><link rel="stylesheet" href="/mobile-ui.css" />
  <title>GeoSafe — Admin Dashboard</title>
</head><body class="app-shell staff-shell"><div class="app-container staff-container">
  <header class="page-header staff-header"><div><div class="brand">GeoSafe System · Admin</div><h1>Incident command</h1></div><div class="staff-user"><span id="user-name"></span><button type="button" class="ui-btn-ghost" onclick="logout()">Logout</button></div></header>
  <main>
    <section class="ui-card alert-composer"><p class="eyebrow">Public warning</p><h2>Broadcast emergency alert</h2><p class="text-muted">This sends a live notification to every signed-in user.</p>
      <form id="alert-form" class="staff-form"><div><label for="alert-message">Message</label><textarea id="alert-message" name="message" required minlength="5" rows="3" class="ui-textarea" placeholder="State the hazard, location, and immediate action..."></textarea></div><div><label for="alert-severity">Severity</label><select id="alert-severity" name="severity" class="ui-select"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><button type="submit" class="ui-btn ui-btn-primary">Broadcast alert</button></form>
    </section>
    <section class="staff-reports"><div class="section-heading"><div><p class="eyebrow">Live queue</p><h2>All disaster reports</h2></div><button type="button" onclick="loadReports()" class="ui-btn ui-btn-secondary ui-btn-inline">Refresh</button></div><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>ID</th><th>Type</th><th>Reporter</th><th>Severity</th><th>Status</th><th>Responder</th><th>Actions</th></tr></thead><tbody id="reports-table"></tbody></table></div></section>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script><script>
const user = requireAuth(['admin']); if (!user) throw new Error('unauthorized'); document.getElementById('user-name').textContent = user.name; let responders = [];
async function loadResponders() { const { users } = await api('/api/users'); responders = users.filter((u) => u.role === 'responder'); }
function responderOptions(selectedId) { let html = '<option value="">Unassigned</option>'; responders.forEach((r) => { html += `<option value="${r.id}" ${r.id === selectedId ? 'selected' : ''}>${escapeHtml(r.name)}</option>`; }); return html; }
function renderRow(r) { return `<tr data-id="${r.id}"><td data-label="Report">#${r.id}</td><td data-label="Type">${escapeHtml(r.incident_type)}</td><td data-label="Reporter">${escapeHtml(r.reporter_name || 'Unknown')}</td><td data-label="Severity"><select aria-label="Severity for report ${r.id}" class="severity-select table-select" data-id="${r.id}"><option value="">—</option><option value="low" ${r.severity === 'low' ? 'selected' : ''}>Low</option><option value="medium" ${r.severity === 'medium' ? 'selected' : ''}>Medium</option><option value="high" ${r.severity === 'high' ? 'selected' : ''}>High</option></select></td><td data-label="Status">${statusBadge(r.status)}</td><td data-label="Responder"><select aria-label="Responder for report ${r.id}" class="assign-select table-select" data-id="${r.id}">${responderOptions(r.assigned_to)}</select></td><td data-label="Actions" class="table-actions">${r.status === 'pending' ? `<button class="verify-btn table-btn table-btn--verify" data-id="${r.id}">Verify</button>` : ''}${r.status === 'verified' ? `<button class="dispatch-btn table-btn table-btn--dispatch" data-id="${r.id}">Dispatch</button>` : ''}</td></tr><tr class="report-detail"><td colspan="7">${escapeHtml(r.description)} · 📍 ${r.latitude}, ${r.longitude} · ${formatDate(r.created_at)}</td></tr>`; }
async function updateReport(id, body) { await api(`/api/reports/${id}/status`, { method: 'PUT', body: JSON.stringify(body) }); showToast('Report updated', 'success'); loadReports(); }
async function loadReports() { const tbody = document.getElementById('reports-table'); try { const { reports } = await api('/api/reports'); tbody.innerHTML = reports.length ? reports.map(renderRow).join('') : '<tr><td colspan="7" class="table-empty">No reports yet.</td></tr>'; tbody.querySelectorAll('.severity-select').forEach((sel) => sel.addEventListener('change', () => updateReport(sel.dataset.id, { severity: sel.value }))); tbody.querySelectorAll('.assign-select').forEach((sel) => sel.addEventListener('change', () => updateReport(sel.dataset.id, { assigned_to: sel.value ? parseInt(sel.value, 10) : null }))); tbody.querySelectorAll('.verify-btn').forEach((btn) => btn.addEventListener('click', () => updateReport(btn.dataset.id, { status: 'verified' }))); tbody.querySelectorAll('.dispatch-btn').forEach((btn) => btn.addEventListener('click', () => updateReport(btn.dataset.id, { status: 'responding' }))); } catch (err) { tbody.innerHTML = `<tr><td colspan="7" class="table-empty text-error">${escapeHtml(err.message)}</td></tr>`; } }
document.getElementById('alert-form').addEventListener('submit', async (e) => { e.preventDefault(); const fd = new FormData(e.target); try { await api('/api/alerts', { method: 'POST', body: JSON.stringify({ message: fd.get('message'), severity: fd.get('severity') }) }); showToast('Alert broadcast to all users', 'success'); e.target.reset(); } catch (err) { showToast(err.message, 'danger'); } });
initSocket({ 'new-report': (report) => { showToast(`New report: ${report.incident_type} (#${report.id})`, 'warning'); loadReports(); }, 'status-update': () => loadReports() }); loadResponders().then(loadReports);
</script></body></html>
