<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1565C0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/critical.css" />
  <link rel="stylesheet" href="/mobile-ui.css?v=3.6" />
  <title>GeoSafe — Life360 Family Safety Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Life360-Style Theme & Component Tokens */
    .family-circle-header {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .circle-name-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .circle-status-chip {
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      background: var(--success-light);
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Life360 Map Box */
    .l360-map-container {
      width: 100%;
      height: 320px;
      min-height: 320px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1.5px solid var(--border);
      position: relative;
      background: #E5E7EB;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    #family-map {
      width: 100%;
      height: 100%;
      min-height: 320px;
      z-index: 1;
    }

    /* Life360 Custom Pin Markers */
    .l360-member-pin {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .l360-pin-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      z-index: 3;
    }

    .l360-pin-avatar--sos {
      background: #D32F2F !important;
      animation: sosPulse 1s infinite alternate;
    }

    .l360-pin-avatar--warning {
      background: #F57C00 !important;
    }

    .l360-pin-battery {
      position: absolute;
      bottom: -4px;
      right: 0px;
      background: #202124;
      color: #A7F3D0;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 8px;
      border: 1.5px solid white;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .l360-pin-pulse {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(21, 101, 192, 0.25);
      animation: gpsPulse 2s infinite ease-out;
      z-index: 1;
    }

    /* Member Card in Tray */
    .l360-member-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .l360-member-card:hover {
      border-color: var(--primary);
    }

    .l360-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .l360-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .l360-card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--primary);
      flex-shrink: 0;
      position: relative;
    }

    .l360-batt-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-app);
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .l360-batt-pill--low {
      color: var(--emergency);
      background: var(--emergency-light);
      border-color: #FFCDD2;
    }

    .l360-actions-row {
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--border-light);
      padding-top: 10px;
    }

    .l360-btn-action {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-app);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .l360-btn-action:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    @keyframes sosPulse {
      from { transform: scale(1); box-shadow: 0 0 0 rgba(211, 47, 47, 0.4); }
      to { transform: scale(1.15); box-shadow: 0 0 16px rgba(211, 47, 47, 0.8); }
    }

    @keyframes gpsPulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
  </style>
</head>
<body class="app-shell">
  <div class="app-container">
    <!-- Resident Topbar -->
    <header class="resident-topbar">
      <div class="resident-brand">
        <span class="resident-brand__mark">⌖</span>
        <span>GeoSafe</span>
      </div>
      <div class="resident-topbar__actions" style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
        <button type="button" class="resident-avatar" id="header-avatar" onclick="openProfileModal()" aria-label="Open Profile Settings">JD</button>
      </div>
    </header>

    <div style="margin-bottom:12px;">
      <h1 style="font-size:22px; font-weight:800; margin:0;">Family Safety Circle</h1>
      <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Live Life360-style GPS tracking, battery levels, and safety status.</p>
    </div>

    <!-- Active Family Circle (Life360 View) -->
    <div id="has-family" style="display:flex; flex-direction:column; gap:14px;">
      
      <!-- Circle Header Info -->
      <section class="family-circle-header">
        <div>
          <div class="circle-name-title">
            <span style="font-size:20px;">🛡️</span>
            <span id="family-name">Dela Cruz Family Circle</span>
          </div>
          <p id="family-desc" style="font-size:12px; color:var(--text-muted); margin:2px 0 0;">Purok 3, Barangay Bayanan</p>
        </div>
        <div style="text-align:right;">
          <span id="circle-summary-badge" class="circle-status-chip">● All Safe</span>
          <div style="margin-top:4px;">
            <button type="button" onclick="copyInviteCode()" style="background:var(--primary-light); color:var(--primary); border:none; border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; cursor:pointer;">
              Code: <span id="invite-code-chip">BAYANAN8</span> 📋
            </button>
          </div>
        </div>
      </section>

      <!-- Life360 Live Map -->
      <section class="l360-map-container">
        <div class="map-card__badge">
          <span class="map-card__badge-dot" style="background:var(--green);"></span>
          <span id="map-status">Live Family GPS Active</span>
        </div>
        <div id="family-map"></div>
      </section>

      <!-- Quick Check-in & Share Live GPS -->
      <section class="ui-card" style="padding:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h2 style="margin:0; font-size:15px;">My Live Status &amp; Check-In</h2>
          <span id="my-batt-display" class="l360-batt-pill">🔋 85% Battery</span>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;">
          <button type="button" onclick="quickSetSafety('safe')" id="btn-status-safe" class="ui-btn" style="background:var(--success-light); color:var(--success); font-size:12px; padding:8px 4px; border:2px solid var(--success);">
            🟢 Safe
          </button>
          <button type="button" onclick="quickSetSafety('need_help')" id="btn-status-help" class="ui-btn" style="background:var(--warning-light); color:var(--warning); font-size:12px; padding:8px 4px; border:1px solid var(--border);">
            🟠 Need Help
          </button>
          <button type="button" onclick="quickSetSafety('injured')" id="btn-status-sos" class="ui-btn" style="background:var(--emergency-light); color:var(--emergency); font-size:12px; padding:8px 4px; border:1px solid var(--border);">
            🚨 SOS Rescue
          </button>
        </div>

        <button type="button" id="share-gps-btn" onclick="syncMyLiveGPS()" class="ui-btn ui-btn-primary" style="font-size:13px; padding:10px;">
          📍 Check-In &amp; Sync My Live Location
        </button>
      </section>

      <!-- Family Members List (Life360 Tray) -->
      <section class="ui-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2 style="margin:0; font-size:16px;">Family Members (<span id="member-count">3</span>)</h2>
          <button type="button" onclick="openAddMemberModal()" class="ui-btn ui-btn-secondary" style="width:auto; padding:6px 12px; font-size:11px; font-weight:700;">
            ➕ Add Member
          </button>
        </div>
        <div id="members-list"></div>
      </section>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div id="add-member-modal" class="profile-modal-backdrop" style="display:none;" onclick="if(event.target===this) closeAddMemberModal()">
    <div class="profile-modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0; font-size:17px; font-weight:800;">Add Family Member</h2>
        <button type="button" class="profile-modal-close" onclick="closeAddMemberModal()">&times;</button>
      </div>

      <form id="add-member-form" onsubmit="handleAddMember(event)">
        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Full Name</label>
        <input name="name" id="new-mem-name" required placeholder="e.g. Maria Dela Cruz" class="ui-input" />

        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Relationship</label>
        <select name="relationship" id="new-mem-rel" class="ui-select">
          <option value="Spouse">Spouse / Partner</option>
          <option value="Child (Student)">Child / Student</option>
          <option value="Parent">Parent / Elderly</option>
          <option value="Sibling">Sibling</option>
          <option value="Relative">Relative</option>
          <option value="Household Member">Household Member</option>
        </select>

        <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Mobile Phone Number</label>
        <input type="tel" name="phone" id="new-mem-phone" required placeholder="0918-000-0000" class="ui-input" />

        <button type="submit" class="ui-btn ui-btn-primary" style="margin-top:10px; padding:12px;">Add to Family Circle</button>
      </form>
    </div>
  </div>

  <script src="/firebase-config.js"></script>
  <script src="/evacuation-routes.js"></script>
  <script src="/app.js"></script>
  <script>
    const user = requireAuth(['resident']);
    if (!user) throw new Error('unauthorized');
    injectBottomNav('family');

    if (user.name) {
      const initials = user.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('header-avatar').textContent = initials || 'JD';
    }

    let familyMap = null;
    let memberMarkers = {};
    let markerLayerGroup = null;

    // Default Seed Data
    const DEFAULT_FAMILY = {
      id: 'default_circle',
      name: 'Dela Cruz Family Circle',
      description: 'Purok 3, Barangay Bayanan',
      invite_code: 'BAYANAN8',
      members: [
        {
          id: user.id || 4,
          name: user.name || 'Juan Dela Cruz',
          relationship: 'Head',
          safety_status: 'safe',
          is_family_head: true,
          battery_level: 85,
          phone: user.phone || '0917-889-2345',
          last_latitude: 14.4106,
          last_longitude: 121.0502,
          last_location_name: 'Near Bayanan Covered Court',
          last_location_at: new Date().toISOString()
        },
        {
          id: 5,
          name: 'Maria Dela Cruz',
          relationship: 'Spouse',
          safety_status: 'safe',
          is_family_head: false,
          battery_level: 64,
          phone: '0918-765-4321',
          last_latitude: 14.4095,
          last_longitude: 121.0486,
          last_location_name: 'At Baywalk Lakeshore Court',
          last_location_at: new Date(Date.now() - 4 * 60000).toISOString()
        },
        {
          id: 6,
          name: 'Leo Dela Cruz',
          relationship: 'Son (Student)',
          safety_status: 'safe',
          is_family_head: false,
          battery_level: 42,
          phone: '0919-456-7890',
          last_latitude: 14.4118,
          last_longitude: 121.0517,
          last_location_name: 'Bayanan Elementary School Unit 1',
          last_location_at: new Date(Date.now() - 10 * 60000).toISOString()
        }
      ]
    };

    let familyData = getLocalStore('family_circle', DEFAULT_FAMILY);

    // Save & Sync Family Data
    async function persistFamilyData() {
      setLocalStore('family_circle', familyData);
      if (window.GeoSafeDB) {
        try {
          await window.GeoSafeDB.saveFamily('default_circle', familyData);
        } catch (e) {}
      }
    }

    // 1. Initialize Life360 Leaflet Map
    function initFamilyMap() {
      if (familyMap) return;
      familyMap = L.map('family-map', {
        zoomControl: true,
        attributionControl: false
      }).setView([14.4106, 121.0502], 16);

      setupMapTileLayer(familyMap);

      markerLayerGroup = L.layerGroup().addTo(familyMap);
      setTimeout(() => familyMap?.invalidateSize(), 200);
    }

    // 2. Render Life360 Custom Pin Marker
    function createMemberIcon(member) {
      const initials = (member.name || 'Member')
        .split(' ')
        .map(n => n[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();

      const isSOS = member.safety_status === 'injured' || member.safety_status === 'need_help';
      const avatarClass = isSOS ? 'l360-pin-avatar l360-pin-avatar--sos' : 'l360-pin-avatar';
      const batt = member.battery_level || 75;
      const battIcon = batt < 20 ? '🪫' : '🔋';

      return L.divIcon({
        className: 'l360-custom-icon',
        html: `
          <div class="l360-member-pin">
            <div class="l360-pin-pulse"></div>
            <div class="${avatarClass}">${initials}</div>
            <div class="l360-pin-battery">${battIcon} ${batt}%</div>
          </div>
        `,
        iconSize: [52, 52],
        iconAnchor: [26, 26]
      });
    }

    // 3. Update Map Pins & Fit View
    function renderMapPins() {
      if (!familyMap || !markerLayerGroup) return;
      markerLayerGroup.clearLayers();

      const latlngs = [];

      familyData.members.forEach(m => {
        if (m.last_latitude && m.last_longitude) {
          const lat = parseFloat(m.last_latitude);
          const lng = parseFloat(m.last_longitude);
          latlngs.push([lat, lng]);

          const marker = L.marker([lat, lng], { icon: createMemberIcon(m) })
            .bindPopup(`
              <div style="font-family:sans-serif;">
                <strong style="font-size:14px;">${escapeHtml(m.name)}</strong><br>
                <span style="font-size:12px; color:var(--text-muted);">${escapeHtml(m.relationship || 'Family Member')}</span><br>
                <span style="display:inline-block; margin:4px 0; font-size:11px; font-weight:700; color:${m.safety_status === 'safe' ? 'var(--success)' : 'var(--emergency)'}">
                  ● ${m.safety_status === 'safe' ? 'Safe' : 'Needs Help'}
                </span><br>
                <small style="color:#666;">📍 ${escapeHtml(m.last_location_name || 'Barangay Bayanan')}</small>
              </div>
            `);

          marker.addTo(markerLayerGroup);
          memberMarkers[m.id] = marker;
        }
      });

      if (latlngs.length > 0) {
        familyMap.fitBounds(L.latLngBounds(latlngs).pad(0.2));
      }
    }

    // 4. Render Members Tray Cards
    function renderMembersList() {
      const container = document.getElementById('members-list');
      const countEl = document.getElementById('member-count');
      if (countEl) countEl.textContent = familyData.members.length;

      const anyInDanger = familyData.members.some(m => m.safety_status !== 'safe');
      const badge = document.getElementById('circle-summary-badge');
      if (badge) {
        if (anyInDanger) {
          badge.textContent = '🚨 Action Needed';
          badge.style.background = 'var(--emergency-light)';
          badge.style.color = 'var(--emergency)';
        } else {
          badge.textContent = '● All Safe';
          badge.style.background = 'var(--success-light)';
          badge.style.color = 'var(--green)';
        }
      }

      container.innerHTML = familyData.members.map(m => {
        const initials = (m.name || 'Member').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        const batt = m.battery_level || 80;
        const isLow = batt < 20;
        const isMe = m.id === (user.id || 4);

        return `
          <div class="l360-member-card">
            <div class="l360-card-top">
              <div class="l360-card-left">
                <div class="l360-card-avatar" style="${m.safety_status !== 'safe' ? 'border-color:var(--emergency); color:var(--emergency);' : ''}">
                  ${initials}
                </div>
                <div>
                  <div style="font-weight:800; font-size:14px; color:var(--text);">
                    ${escapeHtml(m.name)} ${isMe ? '<small style="color:var(--primary); font-weight:700;">(You)</small>' : ''}
                  </div>
                  <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                    ${escapeHtml(m.relationship || 'Household Member')} · <span class="${isLow ? 'l360-batt-pill l360-batt-pill--low' : 'l360-batt-pill'}">${isLow ? '🪫' : '🔋'} ${batt}%</span>
                  </div>
                </div>
              </div>
              <div>
                ${safetyStatusBadge(m.safety_status)}
              </div>
            </div>

            <div style="font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:5px;">
              <span>📍</span> <span>${escapeHtml(m.last_location_name || 'Barangay Bayanan')}</span>
            </div>

            <div class="l360-actions-row">
              <button type="button" class="l360-btn-action" onclick="focusMember(${m.id})">
                🎯 Focus Pin
              </button>
              <button type="button" class="l360-btn-action" onclick="navigateToMember(${m.last_latitude}, ${m.last_longitude}, '${escapeHtml(m.name)}')">
                🧭 Directions
              </button>
              <button type="button" class="l360-btn-action" onclick="callMember('${m.phone || '09170000000'}')">
                📞 Call
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. Member Actions
    function focusMember(id) {
      const m = familyData.members.find(x => x.id === id);
      if (m && m.last_latitude && m.last_longitude && familyMap) {
        familyMap.setView([m.last_latitude, m.last_longitude], 18, { animate: true });
        if (memberMarkers[id]) memberMarkers[id].openPopup();
      }
    }

    function navigateToMember(lat, lng, name) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`, '_blank');
    }

    function callMember(phone) {
      window.location.href = `tel:${phone}`;
    }

    function copyInviteCode() {
      const code = familyData.family?.invite_code || 'BAYANAN8';
      navigator.clipboard.writeText(code).then(() => {
        showToast(`📋 Family Invite Code copied: ${code}`, 'success');
      }).catch(() => {
        showToast(`Invite code: ${code}`);
      });
    }

    // 6. Quick Safety Status Selector
    async function quickSetSafety(status) {
      document.getElementById('btn-status-safe').style.border = status === 'safe' ? '2px solid var(--success)' : '1px solid var(--border)';
      document.getElementById('btn-status-help').style.border = status === 'need_help' ? '2px solid var(--warning)' : '1px solid var(--border)';
      document.getElementById('btn-status-sos').style.border = status === 'injured' ? '2px solid var(--emergency)' : '1px solid var(--border)';

      const me = familyData.members.find(m => m.id === (user.id || 4));
      if (me) {
        me.safety_status = status;
        renderMapPins();
        renderMembersList();
        persistFamilyData();
        showToast(`Status updated: ${status.toUpperCase()}`, status === 'safe' ? 'success' : 'warning');
      }
    }

    // 7. Sync My GPS & Battery
    async function syncMyLiveGPS() {
      const btn = document.getElementById('share-gps-btn');
      btn.disabled = true;
      btn.textContent = 'Acquiring GPS & Battery…';

      let battLevel = 85;
      if (navigator.getBattery) {
        try {
          const b = await navigator.getBattery();
          battLevel = Math.round(b.level * 100);
          document.getElementById('my-batt-display').textContent = `🔋 ${battLevel}% Battery`;
        } catch (e) {}
      }

      try {
        const pos = await getGeolocation();
        const me = familyData.members.find(m => m.id === (user.id || 4));
        if (me) {
          me.last_latitude = pos.latitude;
          me.last_longitude = pos.longitude;
          me.battery_level = battLevel;
          me.last_location_name = 'Live GPS Updated · Bayanan';
          me.last_location_at = new Date().toISOString();
          renderMapPins();
          renderMembersList();
          persistFamilyData();
          showToast('✅ Live GPS & battery synced with family circle!', 'success');
        }
      } catch (err) {
        showToast('📍 Using standard Bayanan coordinates.');
      } finally {
        btn.disabled = false;
        btn.textContent = '📍 Check-In & Sync My Live Location';
      }
    }

    // 8. Add Member Modal
    function openAddMemberModal() {
      document.getElementById('add-member-modal').style.display = 'flex';
    }

    function closeAddMemberModal() {
      document.getElementById('add-member-modal').style.display = 'none';
    }

    function handleAddMember(e) {
      e.preventDefault();
      const name = document.getElementById('new-mem-name').value.trim();
      const rel = document.getElementById('new-mem-rel').value;
      const phone = document.getElementById('new-mem-phone').value.trim();

      if (!name) return;

      const newMember = {
        id: Date.now(),
        name: name,
        relationship: rel,
        safety_status: 'safe',
        is_family_head: false,
        battery_level: 90,
        phone: phone || '0917-000-0000',
        last_latitude: 14.4106 + (Math.random() - 0.5) * 0.004,
        last_longitude: 121.0502 + (Math.random() - 0.5) * 0.004,
        last_location_name: 'Purok 3, Barangay Bayanan',
        last_location_at: new Date().toISOString()
      };

      familyData.members.push(newMember);
      persistFamilyData();
      renderMapPins();
      renderMembersList();
      closeAddMemberModal();
      document.getElementById('add-member-form').reset();
      showToast(`Added ${name} to Family Circle!`, 'success');
    }

    // 9. Real-time Firestore Cloud Listener
    if (window.GeoSafeDB) {
      window.GeoSafeDB.getFamily('default_circle').then((cloudData) => {
        if (cloudData && cloudData.members) {
          familyData = cloudData;
          renderMapPins();
          renderMembersList();
        }
      });

      window.GeoSafeDB.listenFamily('default_circle', (cloudData) => {
        if (cloudData && cloudData.members) {
          familyData = cloudData;
          renderMapPins();
          renderMembersList();
        }
      });
    }

    // Auto Init
    initFamilyMap();
    renderMapPins();
    renderMembersList();

    // Auto battery query
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        const battLevel = Math.round(b.level * 100);
        document.getElementById('my-batt-display').textContent = `🔋 ${battLevel}% Battery`;
      }).catch(() => {});
    }

    window.addEventListener('resize', () => familyMap?.invalidateSize());
  </script>
</body>
</html>
